version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - typecheck

issues:
  exclude-rules:
    - path: cmd/
      linters: [errcheck]
    - path: pkg/controller/
      linters: [errcheck]
    - path: pkg/skoop/
      linters: [errcheck]
    - path: webui/
      linters: [errcheck]
