# Explicit manifest paths (directory globs are ignored by some SCA automatic runs).
sonar.sca.exclusions=pkg/skoop/go.mod,pkg/controller/go.mod,cmd/skoop/go.mod,cmd/collector/go.mod,cmd/controller/go.mod,test/skoop/go.mod,webui/go.mod,tools/bpf2go/go.mod
