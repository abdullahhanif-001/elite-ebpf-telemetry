# SonarCloud Automatic Analysis (must live beside sonar-project.properties).
sonar.projectKey=abdullahhanif-001_elite-ebpf-telemetry
sonar.organization=abdullahhanif-001
# Source + SCA scope: Elite agent only (exclude diagnose stack, vendored libbpf, CI-only builder).
