apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netshoot-hostnetwork
  namespace: default
spec:
  selector:
    matchLabels:
      app: netshoot-hostnetwork
  template:
    metadata:
      labels:
        app: netshoot-hostnetwork
        role: executor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alive
          image: nicolaka/netshoot:v0.13
          command:
            - "sleep"
            - "30d"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
