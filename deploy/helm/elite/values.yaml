replicaCount: 1

image:
  repository: ghcr.io/abdullahhanif-001/elite-ebpf-telemetry/agent
  tag: v1.0.0
  # Pin digest when known (preferred over mutable tag): sha256:...
  digest: ""
  pullPolicy: IfNotPresent

forecast:
  enabled: true
  interval: 1s
  horizon: 5s
  window: 8
  alpha: 0.3
  hardDropSeconds: 0.1
  accThreshold: 0.001
  mode: dry-run
  semiCooldown: 60s
  readPSI: true
  decisionPath: /var/lib/elite/predict-decision.json

agent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi

probes:
  socketlatency: true
  kernellatency: true
  softirq: true
  packetloss: true
  tcpsummary: true
  connecttrace: true

otel:
  enabled: false
  endpoint: "https://otel-collector.observability:4317"
  interval: 15s
  batchSize: 256
  service: elite-agent

service:
  port: 9102

namespace: elite
