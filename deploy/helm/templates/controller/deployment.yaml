{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: {{ .Release.Namespace }}
{{- with .Values.controller }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      name: controller
      labels:
        app: controller
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.imagePullPolicy }}
          command:
            - "/bin/controller"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          livenessProbe:
            tcpSocket:
              port: 10270
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 10270
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: lib
              mountPath: /var/lib/elite
            - name: config
              mountPath: /etc/elite
            - name: tmp
              mountPath: /tmp
          resources:
            {{ toYaml .resources | nindent 12 }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: lib
          emptyDir: { }
        - name: config
          configMap:
            name: controller-config
        - name: tmp
          emptyDir: { }
{{- end }}
{{- end }}