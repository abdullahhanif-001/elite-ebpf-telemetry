name: Elite CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel: [5.15, 6.1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n benchmarks/run-overhead.sh
          bash -n benchmarks/run-loadtest.sh
          bash -n deploy/contabo/run-overhead-systemd.sh
          bash -n deploy/contabo/run-loadtest.sh
          bash -n deploy/contabo/pm2-guard.sh
          bash -n deploy/contabo/security-audit.sh
          bash -n deploy/contabo/final-stress-test.sh
          bash -n scripts/audit-commit.sh
          bash -n scripts/elite-adversarial-audit.sh

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Generate BPF
        run: make generate-bpf
        env:
          GOARCH: amd64
          BPF_CFLAGS: -O2 -g

      - name: Go test
        run: |
          go test ./pkg/export/... ./pkg/exporter/... -coverprofile=coverage.out -covermode=atomic -timeout 5m
          (cd pkg/controller && go mod tidy && go test ./... -timeout 5m)

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-out
          path: coverage.out

      - name: Build exporter
        run: make build-elite-agent

  benchmark-gate:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify benchmark scripts
        run: |
          bash -n benchmarks/run-overhead.sh
          bash -n benchmarks/run-loadtest.sh
