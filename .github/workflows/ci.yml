name: Elite CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel: [5.15, 6.1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n benchmarks/run-overhead.sh
          bash -n benchmarks/run-loadtest.sh
          bash -n deploy/contabo/run-overhead-systemd.sh
          bash -n deploy/contabo/run-loadtest.sh
          bash -n deploy/contabo/pm2-guard.sh
          bash -n deploy/contabo/security-audit.sh
          bash -n deploy/contabo/final-stress-test.sh
          bash -n scripts/audit-commit.sh
          bash -n scripts/elite-adversarial-audit.sh
          bash -n scripts/oneclick/claim-charter-grep.sh
          bash -n scripts/oneclick/category-bakeoff.sh
          bash -n scripts/oneclick/ecgf-bench.sh
          bash -n scripts/oneclick/ecgf-redteam.sh
          bash -n scripts/oneclick/gates-checklist.sh
          bash -n scripts/oneclick/write-phase-b-reports.sh
          bash -n scripts/oneclick/ebpf-xray-real-proof.sh
          bash -n scripts/oneclick/elite-run-complete.sh
          bash -n scripts/oneclick/elite-zero-buffer-complete.sh
          bash -n scripts/oneclick/traffic-engine-proof.sh
          bash -n scripts/oneclick/thundering-herd-proof.sh
          bash -n benchmarks/contabo-gates/w5-xdp-graduated-shed.sh
          bash -n benchmarks/thundering-herd/run.sh
          bash -n benchmarks/zero-buffer/matrix.sh
          bash -n benchmarks/zero-buffer/g14-multicore.sh
          bash -n scripts/oneclick/g10-priority-pass-proof.sh
          bash -n scripts/oneclick/g15-federate-propagation-proof.sh
          bash -n scripts/oneclick/elite-oneclick.sh
          bash -n scripts/oneclick/elite-pm2-uninstall-guard.sh
          bash -n scripts/oneclick/elite-vps-uninstall-safe.sh
          bash -n scripts/oneclick/vps-disk-clean-keep-one.sh
          bash scripts/oneclick/claim-charter-grep.sh

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Generate BPF
        run: make generate-bpf
        env:
          GOARCH: amd64
          BPF_CFLAGS: -O2 -g

      - name: Go test
        run: |
          go test ./pkg/export/... ./pkg/exporter/... ./pkg/forecaster/... ./pkg/dcic/... ./pkg/llc/... ./pkg/ecgf/... ./pkg/elitecontroller/... -coverprofile=coverage.out -covermode=atomic -timeout 10m
          go test ./cmd/elite-updater/... -timeout 2m
          go build -o /tmp/elite-controller ./cmd/elite-controller/
          (cd pkg/controller && go mod tidy && go test ./... -timeout 5m)

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-out
          path: coverage.out

      - name: Build exporter and updater
        run: |
          make build-elite-agent
          make build-elite-updater

  benchmark-gate:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify benchmark scripts
        run: |
          bash -n benchmarks/run-overhead.sh
          bash -n benchmarks/run-loadtest.sh
