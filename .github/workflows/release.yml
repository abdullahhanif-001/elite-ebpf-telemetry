name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm make

      - name: Generate BPF and build binaries
        run: |
          make generate-bpf
          make build-elite-agent
          make build-elite-updater
          GOARCH=amd64 CGO_ENABLED=0 go build -o bin/elite-agent.linux-amd64 -ldflags "-X github.com/alibaba/kubeskoop/version.Version=${GITHUB_REF_NAME} -X github.com/alibaba/kubeskoop/version.Commit=${GITHUB_SHA} -w -s" ./cmd/exporter
          GOARCH=amd64 CGO_ENABLED=0 go build -o bin/elite-updater.linux-amd64 -ldflags "-X github.com/alibaba/kubeskoop/version.Version=${GITHUB_REF_NAME} -X github.com/alibaba/kubeskoop/version.Commit=${GITHUB_SHA} -w -s" ./cmd/elite-updater
          cp -f bin/elite-agent.linux-amd64 bin/elite-agent
          cp -f bin/elite-updater.linux-amd64 bin/elite-updater
          cp -f install.sh bin/install.sh
          cp -f scripts/oneclick/versions.env bin/versions.env
          cp -f config/update.yaml bin/update.yaml
          (
            cd bin
            sha256sum elite-agent.linux-amd64 elite-updater.linux-amd64 elite-agent elite-updater install.sh versions.env update.yaml > SHA256SUMS
          )

      - name: Sign with cosign (keyless)
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Cosign sign blobs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes --bundle bin/elite-agent.linux-amd64.sig bin/elite-agent.linux-amd64
          cosign sign-blob --yes --bundle bin/elite-updater.linux-amd64.sig bin/elite-updater.linux-amd64
          cosign sign-blob --yes --bundle bin/SHA256SUMS.sig bin/SHA256SUMS

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elite-release-binaries
          path: |
            bin/elite-agent
            bin/elite-agent.linux-amd64
            bin/elite-updater
            bin/elite-updater.linux-amd64
            bin/install.sh
            bin/versions.env
            bin/update.yaml
            bin/SHA256SUMS
            bin/*.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf282be4b5b156aa # v2.2.1
        with:
          files: |
            bin/elite-agent
            bin/elite-agent.linux-amd64
            bin/elite-agent.linux-amd64.sig
            bin/elite-updater
            bin/elite-updater.linux-amd64
            bin/elite-updater.linux-amd64.sig
            bin/install.sh
            bin/versions.env
            bin/update.yaml
            bin/SHA256SUMS
            bin/SHA256SUMS.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
