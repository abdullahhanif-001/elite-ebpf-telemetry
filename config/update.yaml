# Elite auto-update channel (copied to /opt/elite/config/update.yaml)
channel: stable
repo: abdullahhanif-001/elite-ebpf-telemetry
check_interval: 6h
auto_apply: true
bin_dir: /opt/elite/bin
previous_dir: /opt/elite/bin/previous
agent_unit: elite-agent
agent_bin: elite-agent
updater_bin: elite-updater
health_url: http://127.0.0.1:9102/metrics
health_timeout: 45s
# Set true when release assets are cosign-signed in CI
require_cosign: false
# Prefer arch-qualified assets; fall back to bare elite-agent
asset_name: ""
# After binary update, refresh pack pins if versions.env changed
update_packs: true
versions_env_path: /opt/elite/scripts/oneclick/versions.env
pm2_guard: /opt/elite/scripts/pm2-guard.sh
