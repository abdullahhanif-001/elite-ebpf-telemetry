# Elite Physics Pack — optional Docker Compose helpers
# Prefer systemd + GH binaries on server. This compose is for lab hosts with Docker.
#
#   docker compose -f scripts/oneclick/docker-compose.physics.yml up -d
#
# Elite agent itself is NOT containerized here (needs host BPF + your binary).

services:
  ebpf_exporter:
    image: ghcr.io/cloudflare/ebpf_exporter:v2.5.1
    privileged: true
    network_mode: host
    pid: host
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
    command:
      - --config.dir=examples
      - --config.names=softirq-latency-net-rx,kfree_skb,tcp-retransmit,udp-drops,shrinklat
      - --web.listen-address=127.0.0.1:9435
    restart: unless-stopped
